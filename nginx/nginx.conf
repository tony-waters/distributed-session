events {}

http {
  # No ip_hash / sticky-session directive: plain round-robin, so consecutive
  # requests land on different instances and prove the session lives in Redis,
  # not local memory (ticket 5). Known limitation: these hostnames resolve once
  # at nginx startup, so recreating a backend container mid-run (not covered by
  # this ticket's acceptance criteria, which only exercise the initial bring-up)
  # would need an nginx reload to pick up its new IP.
  upstream login_service {
    server login-service-1:8080;
    server login-service-2:8080;
    server login-service-3:8080;
  }

  upstream cart_service {
    server cart-service-1:8080;
    server cart-service-2:8080;
    server cart-service-3:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://login_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 8081;

    location / {
      proxy_pass http://cart_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
