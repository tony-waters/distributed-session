events {}

http {
  # No ip_hash / sticky-session directive: plain round-robin, so consecutive
  # requests land on different instances and prove the session lives in Redis,
  # not local memory (ticket 5). Known limitation: these hostnames resolve once
  # at nginx startup, so recreating a backend container mid-run (not covered by
  # this ticket's acceptance criteria, which only exercise the initial bring-up)
  # would need an nginx reload to pick up its new IP.
  upstream login_service {
    server login-service-1:8080;
    server login-service-2:8080;
    server login-service-3:8080;
  }

  upstream cart_service {
    server cart-service-1:8080;
    server cart-service-2:8080;
    server cart-service-3:8080;
  }

  # Single instance: the React build is a static asset, not part of what this demo scales.
  upstream frontend {
    server frontend:80;
  }

  # Demo UI (ticket 7). The page and the API it calls are served from one origin, so the
  # SESSION cookie needs no CORS handling and cross-site POSTs stay blocked by SameSite=Lax
  # (ADR-0005). API calls arrive under /api and are stripped back to the paths the services
  # actually publish, so the services themselves stay unaware of the frontend.
  server {
    listen 3000;

    # Longest matching prefix wins regardless of order here, so /api/cart and /api/cart/add
    # reach cart-service while every other /api path falls through to login-service.
    location /api/cart {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://cart_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://login_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # Unchanged bare entrypoints: curl and k6/cross-instance-proof.js still drive the services
  # directly, without the /api prefix the frontend uses.
  server {
    listen 8080;

    location / {
      proxy_pass http://login_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 8081;

    location / {
      proxy_pass http://cart_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
